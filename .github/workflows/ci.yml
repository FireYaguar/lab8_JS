name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck # tsc під strict для всіх пакетів — типи стираються, тож перевірка тут, а не в рантаймі
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e # два браузери в одній кімнаті: рух і чат (сервер піднімає playwright.config.ts)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

  # Lab 8: образ збирається на кожен push і перевіряється: < 200 МБ, не root, HEALTHCHECK, docker stop < 10 с
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t spacefight:local --build-arg GIT_SHA=${{ github.sha }} --build-arg APP_VERSION=${{ github.ref_name }} .
      - run: sh scripts/docker-check.sh spacefight:local
