<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spacefight</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#05060c" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060c;
        overflow: hidden;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #ui {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        font: 14px ui-monospace, Menlo, Consolas, monospace;
        color: #cfe3ff;
      }
      #ui > * {
        pointer-events: auto;
      }
      .panel {
        background: #0a0d1a;
        border: 1px solid #5aa0ff;
        border-radius: 8px;
        padding: 20px 24px;
        min-width: 340px;
      }
      .panel h1 {
        margin: 0 0 12px;
        font-size: 22px;
      }
      .panel ul {
        list-style: none;
        padding: 0;
        margin: 6px 0;
      }
      .panel li {
        padding: 4px 0;
      }
      .panel li span {
        color: #9ab;
      }
      .rooms-head {
        display: flex;
        justify-content: space-between;
        margin-top: 12px;
        color: #9ab;
      }
      .error {
        color: #ff9a9a;
        min-height: 1em;
      }
      .warn {
        color: #ffd35a;
        margin: 4px 0;
      }
      .chat {
        position: fixed;
        left: 12px;
        bottom: 12px;
        width: 340px;
        min-width: 0;
        padding: 10px 12px;
        font-size: 12px;
        background: rgba(10, 13, 26, 0.85);
      }
      .chat-status {
        color: #ffd35a;
      }
      .chat-status[data-state='open'] {
        color: #9fffb0;
      }
      .chat-roster {
        color: #9ab;
        margin: 4px 0;
      }
      .chat-log {
        margin: 4px 0;
        min-height: 2em;
      }
      .chat-log li {
        padding: 1px 0;
      }
      .chat-input {
        width: 100%;
        box-sizing: border-box;
      }
      .ui-actions {
        position: fixed;
        left: 50%;
        top: calc(50% + 130px);
        transform: translateX(-50%);
      }
      button,
      input {
        font: inherit;
        color: inherit;
        background: #14203a;
        border: 1px solid #5aa0ff;
        border-radius: 4px;
        padding: 6px 12px;
      }
      button {
        cursor: pointer;
      }
      .net-panel {
        position: fixed;
        right: 12px;
        bottom: 12px;
        min-width: 0;
        width: 220px;
        padding: 10px 12px;
        font-size: 12px;
        background: rgba(10, 13, 26, 0.85);
      }
      .net-panel label {
        display: block;
        margin: 4px 0;
      }
      .net-panel input[type='range'] {
        width: 100%;
        padding: 0;
      }
      .net-panel .row input,
      .net-panel select {
        padding: 2px;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
